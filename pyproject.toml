[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-api-mcp"
version = "1.0.0"
description = "MCP server for dynamic/silverstripe-content-api — stdio proxy over the /content-api/v1 REST surface"
readme = "README.md"
authors = [{ name = "Dynamic Agency" }]
requires-python = ">=3.11"
dependencies = [
    # Note: mcp-base is a private repo; consumers need GitHub auth configured
    # (same GITHUB_TOKEN convention used across dynamic/* projects).
    # Pinned to a commit SHA, not a branch — daisy-base cuts no git tags
    # (its own commit messages reference a version like "v2.7.0", but that's
    # never tagged), so a SHA is the only reproducible pin available. Bump
    # deliberately when daisy-base changes create_http_session,
    # create_base_app, or the AuthenticationError/ServiceError/MCPError
    # hierarchy that client.py/server.py depend on.
    "mcp-base @ git+https://github.com/dynamic/daisy-base.git@612a4155d7696c692e82a3376ce94e119a60b141",
    "fastmcp~=3.0.0",
    "requests>=2.31.0",
]

[project.scripts]
content-api-mcp = "content_api_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "responses>=0.24.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["content_api_mcp*"]

[tool.setuptools.package-data]
content_api_mcp = ["schema/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
