[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-api-mcp"
version = "1.5.0"
description = "MCP server for dynamic/silverstripe-content-api — stdio proxy over the /content-api/v1 REST surface"
readme = "README.md"
authors = [{ name = "Dynamic Agency" }]
requires-python = ">=3.11"
dependencies = [
    # No dependency on private dynamic/daisy-base (#27): the four mcp_base
    # symbols this repo used (create_http_session, create_base_app,
    # BaseMCPSettings, the AuthenticationError/ServiceError/MCPError
    # hierarchy) are vendored in content_api_mcp/_base/, so `pip install
    # content-api-mcp` works with no GitHub credentials configured — see
    # that package's own docblock for why and how to bump it deliberately.
    "fastmcp~=3.0.0",
    "requests>=2.31.0",
    "pydantic-settings>=2.0.0",
    # content_api_mcp/_base/errors.py and server.py import starlette at
    # module scope (faithful to the vendored source — see that package's
    # own docblock). Only ever a transitive dep of fastmcp before; declaring
    # it directly so a future fastmcp version that drops or narrows its own
    # starlette requirement can't silently break this repo's import chain.
    "starlette>=0.27",
]

[project.scripts]
content-api-mcp = "content_api_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "responses>=0.24.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["content_api_mcp*"]

[tool.setuptools.package-data]
content_api_mcp = ["schema/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
